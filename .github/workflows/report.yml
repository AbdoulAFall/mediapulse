name: MediaPulse — Rapport email quotidien

on:
  # Le rapport quotidien est désormais envoyé par la boucle Railway à 16h00 UTC.
  # Ce workflow est conservé uniquement pour les tests manuels (workflow_dispatch).
  workflow_dispatch:

jobs:
  report:
    name: Envoyer rapport vues par email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Envoyer rapport
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python main.py report_today
