name: MediaPulse — Détection matinales

on:
  schedule:
    - cron: '*/30 5-13 * * 1-5'  # Toutes les 30 min, 5h–13h UTC, lun–ven
  workflow_dispatch:
    inputs:
      days:
        description: 'Fenêtre de détection en jours (défaut : 1)'
        default: '1'
        required: false
      channel:
        description: 'Chaîne à cibler (ex: "TFM") — vide = toutes'
        default: ''
        required: false

jobs:
  detect:
    name: Détecter nouvelles matinales
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Détecter matinales (live en cours + terminées)
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          CHANNEL="${{ github.event.inputs.channel }}"

          # 1. Lives en cours — search.list avec filtre fenêtre horaire (évite doublons quota)
          python main.py detect_live

          # 2. Replays terminés — playlistItems.list (vidéos visibles après fin du live)
          if [ -n "$CHANNEL" ]; then
            python main.py detect "$DAYS" "$CHANNEL"
          else
            python main.py detect "$DAYS"
          fi
