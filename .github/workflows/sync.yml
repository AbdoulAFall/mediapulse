name: MediaPulse — Sync matinales

on:
  schedule:
    - cron: '0,30 6-11 * * 1-5'  # Toutes les 30 min, 6h-11h30, lun-ven (matinales)
    - cron: '0 13 * * *'          # 13h00 UTC tous les jours (refresh vues après-midi)
    - cron: '0 18 * * *'          # 18h00 UTC tous les jours (refresh vues soirée)
  workflow_dispatch:
    inputs:
      days:
        description: 'Nombre de jours à synchroniser (1–730)'
        default: '60'
        required: false

jobs:
  sync:
    name: Sync matinales
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Sync matinales (60 derniers jours)
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py sync ${{ github.event.inputs.days || '60' }}
