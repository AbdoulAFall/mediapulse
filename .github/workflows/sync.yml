name: MediaPulse — Sync matinales

on:
  schedule:
    - cron: '0,30 6-11 * * 1-5'   # Toutes les 30 min, 6h–11h30, lun–ven (détection + vues 6h)
    - cron: '*/15 6-12 * * 1-5'   # Toutes les 15 min, 6h–12h, lun–ven (snapshot vues J0)
    - cron: '0 13 * * *'           # 13h00 UTC tous les jours (refresh vues après-midi)
    - cron: '0 18 * * *'           # 18h00 UTC tous les jours (refresh vues soirée)
  workflow_dispatch:
    inputs:
      days:
        description: 'Nombre de jours à synchroniser (1–730)'
        default: '60'
        required: false
      command:
        description: 'Commande à exécuter (sync | detect | refresh | refresh_today)'
        default: 'sync'
        required: false
      channel:
        description: 'Chaîne à cibler (ex: "Walf TV", "TFM") — vide = toutes les chaînes'
        default: ''
        required: false

jobs:
  sync:
    name: Sync matinales
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      # ── Snapshot vues J0 toutes les 15 min (6h–12h lun–ven) ───────────────
      - name: Refresh vues J0 (15 min)
        if: github.event_name == 'schedule' && contains(github.event.schedule, '*/15')
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py refresh_today

      # ── Sync standard (détection + refresh 6h) : toutes les 30 min ────────
      - name: Sync matinales
        if: github.event_name != 'schedule' || !contains(github.event.schedule, '*/15')
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CMD="${{ github.event.inputs.command || 'sync' }}"
          DAYS="${{ github.event.inputs.days || '60' }}"
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -n "$CHANNEL" ]; then
            python main.py "$CMD" "$DAYS" "$CHANNEL"
          else
            python main.py "$CMD" "$DAYS"
          fi
