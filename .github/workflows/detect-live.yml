name: MediaPulse — Détection lives en cours

on:
  # Schedule désactivé — la détection live tourne désormais dans la boucle Railway (api/main.py)
  # Conserver workflow_dispatch pour les lancements manuels (debug).
  workflow_dispatch:

# Rôle : DÉCOUVERTE uniquement (trouver le video ID d'une matinale en live).
# Le suivi des concurrentViewers toutes les 15 min est assuré par refresh-today.yml
# via videos.list (1u/appel), sans search.list supplémentaire.
# Quota : filtre horaire → ~5 chaînes/run × 100u × 8 runs = ~4 000u/jour

jobs:
  detect-live:
    name: Snapshot lives + concurrentViewers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Détecter lives en cours
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py detect_live
