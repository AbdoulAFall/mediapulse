name: MediaPulse — Détection lives en cours

on:
  schedule:
    - cron: '*/30 6-10 * * 1-5'  # Toutes les 30 min, 6h–10h UTC, lun–ven
  workflow_dispatch:

# Quota : 100 unités × 10 chaînes = 1 000 unités/run × 8 runs/jour = 8 000 unités/jour

jobs:
  detect-live:
    name: Snapshot lives + concurrentViewers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Détecter lives en cours
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py detect_live
